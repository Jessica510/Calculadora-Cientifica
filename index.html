<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora Científica</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-black text-light d-flex justify-content-center align-items-center min-vh-100 p-3">
    <div class="card bg-dark text-light border-secondary shadow-lg col-12 col-sm-9 col-md-6 col-lg-4">
        <!-- ENCABEZADO -->
        <div class="card-header border-secondary d-flex justify-content-between align-items-center py-2">
            <span class="badge bg-info text-dark fw-bold">BTH 5TO DE SECUNDARIA</span>
            <h1 class="h6 text-uppercase fw-bold text-secondary mb-0">CALCULADORA CIENTÍFICA</h1>
        </div>
        <!-- CUERPO -->
        <div class="card-body p-3">
            <div class="bg-black border border-secondary rounded p-2 mb-2">
                <p id="historial" class="text-end text-secondary small font-monospace mb-1">&nbsp;</p>
                <input type="text" id="pantalla" class="form-control form-control-lg bg-black text-end text-success fw-bold fs-2 border-0 font-monospace p-0 shadow-none" value="0" readonly>
            </div>
            <!-- FILA 1: Funciones trigonométricas y raíz -->
            <div class="row g-2 mb-2">
                <div class="col-3"><button type="button" class="btn btn-outline-info w-100 fw-semibold py-2" onclick="calculaCientifica('sin')">sin</button></div>
                <div class="col-3"><button type="button" class="btn btn-outline-info w-100 fw-semibold py-2" onclick="calculaCientifica('cos')">cos</button></div>
                <div class="col-3"><button type="button" class="btn btn-outline-info w-100 fw-semibold py-2" onclick="calculaCientifica('tan')">tan</button></div>
                <div class="col-3"><button type="button" class="btn btn-outline-info w-100 fw-semibold py-2" onclick="calculaCientifica('sqrt')">√</button></div>
            </div>
            <!-- FILA 2: Potencia, logaritmo, Pi y cambio de signo -->
            <div class="row g-2 mb-2">
                <div class="col-3"><button type="button" class="btn btn-outline-info w-100 fw-semibold py-2" onclick="calculaCientifica('x²')">x²</button></div>
                <div class="col-3"><button type="button" class="btn btn-outline-info w-100 fw-semibold py-2" onclick="calculaCientifica('log')">log</button></div>
                <div class="col-3"><button type="button" class="btn btn-outline-info w-100 fw-semibold py-2" onclick="calculaCientifica('π')">π</button></div>
                <div class="col-3"><button type="button" class="btn btn-outline-info w-100 fw-semibold py-2" onclick="calculaCientifica('±')">±</button></div>
            </div>
            <!-- FILA 3: Limpiar, retroceso, porcentaje y división -->
            <div class="row g-2 mb-2">
                <div class="col-3"><button type="button" class="btn btn-danger w-100 fw-semibold py-2" onclick="calculaCientifica('C')">C</button></div>
                <div class="col-3"><button type="button" class="btn btn-danger w-100 fw-semibold py-2" onclick="calculaCientifica('⌫')">⌫</button></div>
                <div class="col-3"><button type="button" class="btn btn-warning w-100 fw-semibold py-2" onclick="calculaCientifica('%')">%</button></div>
                <div class="col-3"><button type="button" class="btn btn-warning w-100 fw-semibold py-2" onclick="calculaCientifica('÷')">÷</button></div>
            </div>
            <!-- FILA 4: 7, 8, 9 y multiplicación -->
            <div class="row g-2 mb-2">
                <div class="col-3"><button type="button" class="btn btn-secondary w-100 fw-semibold py-2" onclick="calculaCientifica('7')">7</button></div>
                <div class="col-3"><button type="button" class="btn btn-secondary w-100 fw-semibold py-2" onclick="calculaCientifica('8')">8</button></div>
                <div class="col-3"><button type="button" class="btn btn-secondary w-100 fw-semibold py-2" onclick="calculaCientifica('9')">9</button></div>
                <div class="col-3"><button type="button" class="btn btn-warning w-100 fw-semibold py-2" onclick="calculaCientifica('x')">x</button></div>
            </div>
            <!-- FILA 5: 4, 5, 6 y resta -->
            <div class="row g-2 mb-2">
                <div class="col-3"><button type="button" class="btn btn-secondary w-100 fw-semibold py-2" onclick="calculaCientifica('4')">4</button></div>
                <div class="col-3"><button type="button" class="btn btn-secondary w-100 fw-semibold py-2" onclick="calculaCientifica('5')">5</button></div>
                <div class="col-3"><button type="button" class="btn btn-secondary w-100 fw-semibold py-2" onclick="calculaCientifica('6')">6</button></div>
                <div class="col-3"><button type="button" class="btn btn-warning w-100 fw-semibold py-2" onclick="calculaCientifica('-')">-</button></div>
            </div>
            <!-- FILA 6: 1, 2, 3 y suma -->
            <div class="row g-2 mb-2">
                <div class="col-3"><button type="button" class="btn btn-secondary w-100 fw-semibold py-2" onclick="calculaCientifica('1')">1</button></div>
                <div class="col-3"><button type="button" class="btn btn-secondary w-100 fw-semibold py-2" onclick="calculaCientifica('2')">2</button></div>
                <div class="col-3"><button type="button" class="btn btn-secondary w-100 fw-semibold py-2" onclick="calculaCientifica('3')">3</button></div>
                <div class="col-3"><button type="button" class="btn btn-warning w-100 fw-semibold py-2" onclick="calculaCientifica('+')">+</button></div>
            </div>
            <!-- FILA 7: 00, 0, punto decimal e igual -->
            <div class="row g-2 mb-2">
                <div class="col-3"><button type="button" class="btn btn-secondary w-100 fw-semibold py-2" onclick="calculaCientifica('00')">00</button></div>
                <div class="col-3"><button type="button" class="btn btn-secondary w-100 fw-semibold py-2" onclick="calculaCientifica('0')">0</button></div>
                <div class="col-3"><button type="button" class="btn btn-secondary w-100 fw-semibold py-2" onclick="calculaCientifica('.')">.</button></div>
                <div class="col-3"><button type="button" class="btn btn-success w-100 fw-semibold py-2" onclick="calculaCientifica()">=</button></div>
            </div>
            <!-- PIE DE PÁGINA -->
            <div class="text-center small text-secondary">
                Modo Angular: Grados Sexagesimales (DEG)
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
